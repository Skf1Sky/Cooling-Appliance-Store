kind = "web"
previewPath = "/"
title = "Điện Lạnh Store"
version = "1.0.0"
id = "artifacts/dien-lanh-store"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20982

[services.development]
run = "pnpm --filter @workspace/dien-lanh-store run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/dien-lanh-store", "run", "build" ]
publicDir = "artifacts/dien-lanh-store/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20982"
BASE_PATH = "/"
